<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Ilustração do motor de comunicação: Amazon Redshift, Python e pandas, modelo por papel e Microsoft Graph API levando e-mails de exemplo para Assessor, Líder e Diretor">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1b1b1b" stroke-width="1"/></pattern>
    <radialGradient id="v" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
    <marker id="ponta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2c2c2"/></marker>
    <g id="email">
      <rect width="440" height="420" rx="14" fill="#fafaf8"/>
      <path d="M0 14a14 14 0 0 1 14-14h412a14 14 0 0 1 14 14v58H0z" fill="currentColor"/>
      <rect x="24" y="26" width="150" height="10" rx="5" fill="#ffffff" fill-opacity=".75"/>
      <rect x="24" y="44" width="100" height="8" rx="4" fill="#ffffff" fill-opacity=".45"/>
      <rect x="24" y="96" width="210" height="14" rx="7" fill="#0a0a0a"/>
      <rect x="24" y="120" width="300" height="9" rx="4.5" fill="#bdbdbd"/>
      <g fill="#efefed"><rect x="24" y="148" width="122" height="84" rx="10"/><rect x="159" y="148" width="122" height="84" rx="10"/><rect x="294" y="148" width="122" height="84" rx="10"/></g>
      <g fill="#bdbdbd"><rect x="38" y="164" width="60" height="8" rx="4"/><rect x="173" y="164" width="70" height="8" rx="4"/><rect x="308" y="164" width="54" height="8" rx="4"/></g>
      <g fill="#0a0a0a"><rect x="38" y="184" width="76" height="24" rx="5"/><rect x="173" y="184" width="60" height="24" rx="5"/><rect x="308" y="184" width="84" height="24" rx="5"/></g>
      <g fill="#e5e5e5"><rect x="24" y="252" width="392" height="1"/><rect x="24" y="290" width="392" height="1"/><rect x="24" y="328" width="392" height="1"/></g>
      <g fill="#bdbdbd"><rect x="24" y="266" width="170" height="9" rx="4.5"/><rect x="24" y="304" width="140" height="9" rx="4.5"/></g>
      <g fill="#525252"><rect x="356" y="266" width="60" height="9" rx="4.5"/><rect x="346" y="304" width="70" height="9" rx="4.5"/></g>
      <rect x="24" y="352" width="170" height="44" rx="10" fill="currentColor"/>
      <rect x="52" y="370" width="114" height="9" rx="4.5" fill="#fafaf8"/>
    </g>
  </defs>
  <rect width="1600" height="1000" fill="#0a0a0a"/>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <rect width="1600" height="1000" fill="url(#v)"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="80" y="70" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#8e8e8e">motor de comunicação · do banco à caixa de entrada</text>

    <!-- fluxo -->
    <g>
      <rect x="80" y="110" width="290" height="132" rx="16" fill="#141414" stroke="#2563EB" stroke-width="2.5"/>
      <g transform="translate(104 136)" fill="none" stroke="#60A5FA" stroke-width="2.6"><ellipse cx="20" cy="8" rx="18" ry="7"/><path d="M2 8v26c0 4 8 7 18 7s18-3 18-7V8M2 21c0 4 8 7 18 7s18-3 18-7"/></g>
      <text x="160" y="160" font-size="23" font-weight="700" fill="#f5f5f5">Amazon Redshift</text>
      <text x="104" y="214" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#a3a3a3">metas · reservas · alertas</text>

      <rect x="450" y="110" width="290" height="132" rx="16" fill="#141414" stroke="#3776AB" stroke-width="2.5"/>
      <text x="474" y="152" font-family="JetBrains Mono, Consolas, monospace" font-size="26" font-weight="700" fill="#FFD43B">{ }</text>
      <text x="530" y="160" font-size="23" font-weight="700" fill="#f5f5f5">Python e pandas</text>
      <text x="474" y="214" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#a3a3a3">recorte por destinatário</text>

      <rect x="820" y="110" width="290" height="132" rx="16" fill="#141414" stroke="#3a3a3a" stroke-width="2"/>
      <g transform="translate(844 134)" fill="none" stroke="#f5f5f5" stroke-width="2.6" stroke-linejoin="round"><rect x="1" y="1" width="38" height="34" rx="5"/><path d="M1 12h38M14 12v23"/></g>
      <text x="900" y="160" font-size="23" font-weight="700" fill="#f5f5f5">Modelo por papel</text>
      <text x="844" y="214" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#a3a3a3">e-mail HTML responsivo</text>

      <rect x="1190" y="110" width="330" height="132" rx="16" fill="#fafaf8" stroke="#0078D4" stroke-width="4"/>
      <g transform="translate(1214 134)" fill="none" stroke="#0078D4" stroke-width="2.6" stroke-linejoin="round"><rect x="1" y="5" width="38" height="28" rx="4"/><path d="m2 8 18 13L38 8"/></g>
      <text x="1270" y="160" font-size="23" font-weight="700" fill="#0a0a0a">Microsoft Graph API</text>
      <text x="1214" y="214" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#525252">app no Azure AD · OAuth2</text>

      <g stroke="#c2c2c2" stroke-width="2.5" marker-end="url(#ponta)">
        <path d="M376 176H442"/><path d="M746 176H812"/><path d="M1116 176H1182"/><path d="M1355 248V316"/>
      </g>
    </g>

    <!-- caixa de entrada -->
    <rect x="80" y="326" width="1440" height="560" rx="18" fill="#111" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="112" cy="356" r="7" fill="#3a3a3a"/><circle cx="136" cy="356" r="7" fill="#3a3a3a"/><circle cx="160" cy="356" r="7" fill="#3a3a3a"/>
    <text x="800" y="362" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#8e8e8e" text-anchor="middle">caixa de entrada · cada um recebe o próprio recorte</text>
    <rect x="80" y="384" width="1440" height="1" fill="#262626"/>

    <g font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="600">
      <rect x="120" y="406" width="118" height="32" rx="16" fill="#0D9488" stroke="#0D9488"/><text x="179" y="427" fill="#f5f5f5" text-anchor="middle">Assessor</text>
      <rect x="580" y="406" width="92" height="32" rx="16" fill="#D97706" stroke="#D97706"/><text x="626" y="427" fill="#f5f5f5" text-anchor="middle">Líder</text>
      <rect x="1040" y="406" width="104" height="32" rx="16" fill="#7C3AED" stroke="#7C3AED"/><text x="1092" y="427" fill="#f5f5f5" text-anchor="middle">Diretor</text>
    </g>
    <use href="#email" x="120" y="452" style="color:#0D9488"/>
    <use href="#email" x="580" y="452" style="color:#D97706"/>
    <use href="#email" x="1040" y="452" style="color:#7C3AED"/>
  </g>

  <text x="800" y="944" font-family="JetBrains Mono, Consolas, monospace" font-size="17" fill="#8e8e8e" text-anchor="middle">modo de teste · redirecionamento de segurança · prévia · log · retentativa · agendamento</text>
  <rect x="1330" y="40" width="190" height="40" rx="8" fill="#111" stroke="#3a3a3a"/>
  <text x="1425" y="66" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#c2c2c2" text-anchor="middle">ilustrativo</text>
</svg>
