<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Ilustração do Foolproof com dados fictícios: lista de verificações do CSV antes da carga, quatro aprovadas e uma reprovada">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1b1b1b" stroke-width="1"/></pattern>
    <radialGradient id="v" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
    <g id="ok"><circle r="20" fill="#16A34A"/><path d="M-9 0l6 6 12-12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="nok"><circle r="20" fill="#DC2626"/><path d="M-7-7l14 14M7-7l-14 14" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/></g>
  </defs>
  <rect width="1600" height="1000" fill="#0a0a0a"/>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <rect width="1600" height="1000" fill="url(#v)"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
    <rect x="120" y="110" width="1360" height="790" rx="18" fill="#111" stroke="#3a3a3a" stroke-width="2"/>
    <!-- barra lateral -->
    <path d="M138 110h282v790H138a18 18 0 0 1-18-18V128a18 18 0 0 1 18-18z" fill="#161616"/>
    <rect x="420" y="110" width="1" height="790" fill="#262626"/>
    <text x="156" y="176" font-size="30" font-weight="700" fill="#f5f5f5">Foolproof</text>
    <text x="156" y="206" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#8e8e8e">validação antes da carga</text>
    <rect x="156" y="250" width="228" height="150" rx="12" fill="none" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="7 7"/>
    <g transform="translate(250 290)" fill="none" stroke="#c2c2c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 26V2M10 12l10-10 10 10M0 32v6h40v-6"/></g>
    <text x="270" y="374" font-size="15" fill="#a3a3a3" text-anchor="middle">arraste o CSV aqui</text>
    <rect x="156" y="424" width="228" height="48" rx="10" fill="#222"/>
    <text x="176" y="454" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#f5f5f5">carga_exemplo.csv</text>
    <text x="156" y="520" font-family="JetBrains Mono, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#8e8e8e">CONFERE CONTRA</text>
    <rect x="156" y="536" width="228" height="48" rx="10" fill="#222"/>
    <text x="176" y="566" font-size="16" fill="#f5f5f5">Amazon Redshift</text>

    <!-- area principal -->
    <text x="480" y="186" font-size="36" font-weight="700" fill="#f5f5f5">Verificações do arquivo</text>
    <text x="480" y="220" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#8e8e8e">5 regras · resultado por regra</text>

    <g font-size="21">
      <rect x="480" y="256" width="940" height="80" rx="12" fill="#161616" stroke="#262626"/>
      <use href="#ok" x="526" y="296"/><text x="566" y="304" fill="#f5f5f5">Colunas-chave sem nulos</text>
      <rect x="480" y="350" width="940" height="80" rx="12" fill="#161616" stroke="#262626"/>
      <use href="#ok" x="526" y="390"/><text x="566" y="398" fill="#f5f5f5">Datas reais (nada de 31/02)</text>
      <rect x="480" y="444" width="940" height="80" rx="12" fill="#161616" stroke="#262626"/>
      <use href="#ok" x="526" y="484"/><text x="566" y="492" fill="#f5f5f5">Moeda no formato brasileiro</text>
      <rect x="480" y="538" width="940" height="80" rx="12" fill="#2a1313" stroke="#DC2626" stroke-width="2"/>
      <use href="#nok" x="526" y="578"/><text x="566" y="586" fill="#f5f5f5">Categorias permitidas</text>
      <text x="1396" y="586" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#FCA5A5" text-anchor="end">3 linhas fora da lista (exemplo)</text>
      <rect x="480" y="632" width="940" height="80" rx="12" fill="#161616" stroke="#262626"/>
      <use href="#ok" x="526" y="672"/><text x="566" y="680" fill="#f5f5f5">Total do arquivo = total no Redshift</text>
    </g>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#4ADE80">
      <text x="1396" y="304" text-anchor="end">ok</text><text x="1396" y="398" text-anchor="end">ok</text><text x="1396" y="492" text-anchor="end">ok</text><text x="1396" y="680" text-anchor="end">ok</text>
    </g>

    <rect x="480" y="760" width="940" height="88" rx="14" fill="#fafaf8" stroke="#F59E0B" stroke-width="4"/>
    <text x="512" y="813" font-size="22" font-weight="700" fill="#0a0a0a">4 de 5 verificações ok</text>
    <text x="1392" y="812" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#525252" text-anchor="end">revise antes de carregar</text>
  </g>

  <rect x="1190" y="40" width="290" height="40" rx="8" fill="#111" stroke="#3a3a3a"/>
  <text x="1335" y="66" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#c2c2c2" text-anchor="middle">ilustrativo · dados fictícios</text>
</svg>
