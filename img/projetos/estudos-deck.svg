<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Ilustração: quatro slides de estudo gerados do banco, com gráficos genéricos e sem valores: ROA, Renda Variável, PL 2025 x 2026 e Funil de Retenção">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1b1b1b" stroke-width="1"/></pattern>
    <radialGradient id="v" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".65"/></filter>
    <g id="base">
      <rect width="660" height="372" rx="12" fill="#fafaf8"/>
      <text x="30" y="42" font-family="JetBrains Mono, Consolas, monospace" font-size="13" letter-spacing="2" fill="#6b6b6b">ESTUDO · DIRETORIA</text>
      <rect x="30" y="336" width="600" height="1" fill="#e5e5e5"/>
      <text x="30" y="358" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#8c8c8c">fonte: Redshift · só meses fechados</text>
    </g>
  </defs>
  <rect width="1600" height="1000" fill="#0a0a0a"/>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <rect width="1600" height="1000" fill="url(#v)"/>
  <text x="120" y="72" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#8e8e8e">fábrica de estudos · deck gerado direto do banco</text>

  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="30" fill="#0a0a0a">
    <!-- ROA: linha -->
    <g transform="translate(120 110)" filter="url(#sombra)">
      <use href="#base"/>
      <text x="30" y="84">ROA por mês</text>
      <g stroke="#e5e5e5" stroke-width="1.5"><path d="M60 140H630M60 200H630M60 260H630"/></g>
      <path d="M60 310H630M60 120V310" stroke="#bdbdbd" stroke-width="2" fill="none"/>
      <path d="M80 270L150 250L220 262L290 214L360 226L430 186L500 196L570 150L620 140" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#2563EB"><circle cx="80" cy="270" r="6"/><circle cx="220" cy="262" r="6"/><circle cx="360" cy="226" r="6"/><circle cx="500" cy="196" r="6"/><circle cx="620" cy="140" r="7"/></g>
    </g>
    <!-- Renda Variavel: colunas -->
    <g transform="translate(820 110)" filter="url(#sombra)">
      <use href="#base"/>
      <text x="30" y="84">Renda Variável</text>
      <path d="M60 310H630" stroke="#bdbdbd" stroke-width="2"/>
      <g fill="#6EE7B7"><rect x="84" y="230" width="44" height="80" rx="4"/><rect x="152" y="200" width="44" height="110" rx="4"/><rect x="220" y="215" width="44" height="95" rx="4"/><rect x="288" y="170" width="44" height="140" rx="4"/><rect x="356" y="185" width="44" height="125" rx="4"/><rect x="424" y="150" width="44" height="160" rx="4"/><rect x="492" y="160" width="44" height="150" rx="4"/></g>
      <rect x="560" y="122" width="44" height="188" rx="4" fill="#10B981"/>
    </g>
    <!-- PL 2025 x 2026: pares -->
    <g transform="translate(120 522)" filter="url(#sombra)">
      <use href="#base"/>
      <text x="30" y="84">PL 2025 x 2026</text>
      <g font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#525252">
        <rect x="440" y="66" width="14" height="14" rx="3" fill="#94A3B8"/><text x="462" y="78">2025</text>
        <rect x="530" y="66" width="14" height="14" rx="3" fill="#7C3AED"/><text x="552" y="78">2026</text>
      </g>
      <path d="M60 310H630" stroke="#bdbdbd" stroke-width="2"/>
      <g fill="#94A3B8"><rect x="86" y="220" width="30" height="90" rx="3"/><rect x="186" y="210" width="30" height="100" rx="3"/><rect x="286" y="205" width="30" height="105" rx="3"/><rect x="386" y="195" width="30" height="115" rx="3"/><rect x="486" y="190" width="30" height="120" rx="3"/></g>
      <g fill="#7C3AED"><rect x="120" y="196" width="30" height="114" rx="3"/><rect x="220" y="180" width="30" height="130" rx="3"/><rect x="320" y="168" width="30" height="142" rx="3"/><rect x="420" y="150" width="30" height="160" rx="3"/><rect x="520" y="136" width="30" height="174" rx="3"/></g>
    </g>
    <!-- Funil de Retencao -->
    <g transform="translate(820 522)" filter="url(#sombra)">
      <use href="#base"/>
      <text x="30" y="84">Funil de Retenção</text>
      <path d="M90 118H570L540 166H120z" fill="#7C3AED"/>
      <path d="M126 174H534L506 222H154z" fill="#A13FD1"/>
      <path d="M160 230H500L474 278H186z" fill="#C743B5"/>
      <path d="M192 286H468L452 318H208z" fill="#EC4899"/>
    </g>
  </g>

  <text x="800" y="950" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#8e8e8e" text-anchor="middle">SQL, pandas e python-pptx geram os slides publicados como imagem no Smart Ranking</text>
  <rect x="1290" y="40" width="190" height="40" rx="8" fill="#111" stroke="#3a3a3a"/>
  <text x="1385" y="66" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#c2c2c2" text-anchor="middle">ilustrativo</text>
</svg>
